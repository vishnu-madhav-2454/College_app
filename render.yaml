databases:
  - name: college-app-db
    plan: free

services:
  - type: web
    name: college-app
    runtime: node
    plan: free
    buildCommand: npm ci --prefix server && npm ci --include=dev --prefix client && npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: college-app-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: APP_BASE_URL
        value: https://college-app-ezry.onrender.com